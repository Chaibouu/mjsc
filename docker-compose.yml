services:
  db:
    image: postgres:12
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # La base de données est hébergée sur Neon (DATABASE_URL dans .env) ;
  # le service db ci-dessus reste disponible pour un Postgres local.
  app:
    build: .
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    profiles:
      - app

volumes:
  pgdata:
  uploads:
